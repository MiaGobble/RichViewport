name = "miagobble/rich_viewport"
version = "0.1.0"
description = "ViewportFrame wrapper with depth-aware particle mimics (requires Studio UI Particles beta)"
license = "MIT"
authors = ["Mia Gobble"]
repository = "https://github.com/MiaGobble/viewport-particles"
private = false

includes = [
    "pesde.toml",
    "README.md",
    "LICENSE",
    "src/**/*.luau",
]

[target]
environment = "roblox"
lib = "src/init.luau"
build_files = ["src"]

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[place]
shared = "game.ReplicatedFirst.Modules.Packages"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[engines]
pesde = "^0.7.0"
lune = "^0.10.4"

[dependencies]
Seam = { name = "miagobble/seam", version = "^1.1.0" }

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.7.0", target = "lune" }
SeamStoryUtils = { wally = "miagobble/seam-story-utils", version = "^0.1.3" }
UILabs = { wally = "pepeeltoro41/ui-labs", version = "^2.4.2" }
