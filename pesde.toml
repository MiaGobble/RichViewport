name = "miagobble/viewport_particles"
version = "0.1.0"
description = "Viewport Particles"
license = "MIT"
authors = ["MiaGobble"]
repository = "https://github.com/MiaGobble/viewport-particles"
private = true

[target]
environment = "roblox"

[indices]
default = "https://github.com/pesde-pkg/index"

[wally_indices]
default = "https://github.com/UpliftGames/wally-index"

[place]
shared = "game.ReplicatedStorage.SharedModules.Packages"

[scripts]
roblox_sync_config_generator = ".pesde/scripts/roblox_sync_config_generator.luau"
sourcemap_generator = ".pesde/scripts/sourcemap_generator.luau"

[engines]
pesde = "^0.7.0"
lune = "^0.10.4"

[dev_dependencies]
scripts = { name = "pesde/scripts_rojo", version = "^0.2.0", target = "lune" }
rojo = { name = "pesde/rojo", version = "^7.7.0", target = "lune" }

[dependencies]
Seam = { name = "miagobble/seam", version = "^1.1.0" }
